# Codex CLI、Claude Agent SDK 与 DeepSeek Harness 的新版本：每周检查（升级说明见各插件 README）。
# 合并后，Coda 里「设置 › 插件」点「检查更新」就用上；内置副本随 Coda 的 sync-plugins 更新。
version: 2
updates:
  - package-ecosystem: npm
    directory: /plugins/codex
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@openai/codex"
    commit-message:
      prefix: "codex"
  - package-ecosystem: npm
    directory: /plugins/claude
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
    commit-message:
      prefix: "claude"
  - package-ecosystem: npm
    directory: /plugins/dsh
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@deepseek-ai/dsh"
      - dependency-name: "@deepseek-ai/dsh-acp"
    groups:
      deepseek-harness:
        patterns:
          - "@deepseek-ai/dsh"
          - "@deepseek-ai/dsh-acp"
    commit-message:
      prefix: "dsh"
